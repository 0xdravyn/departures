name: checks
on: [push, pull_request]
permissions: { contents: read }
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pattern check over the tracked tree
        run: tools/check-secrets.sh --all
      - name: gitleaks over the whole history
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build a release APK (debug-signed; no keystore in CI)
        run: gradle -p . assembleRelease -q --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: departures-apk, path: app/build/outputs/apk/release/app-release.apk }
