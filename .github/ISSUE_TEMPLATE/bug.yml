name: Bug
description: Something on the board is wrong, or the screensaver does not start
labels: [bug]
body:
  - type: input
    id: tv
    attributes: { label: TV model and Android version, placeholder: "Sony K-50S30, Google TV 12" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Log lines (optional)
      description: "`adb logcat -d -s Departures` after reproducing. Calendar addresses are never logged, but check before pasting."
      render: text
